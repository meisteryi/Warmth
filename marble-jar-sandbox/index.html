<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>온기 (Warmth) — 유리구슬 샌드박스</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Pretendard', sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      .font-serif-warm {
        font-family: 'Noto Serif KR', 'AppleMyungjo', Georgia, serif;
      }
      .jar-page {
        position: relative;
        width: 100%;
        height: 100dvh;
        min-height: 480px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: linear-gradient(to bottom, #f8f5ee, #f3ede2, #ebe2d4);
      }
      .paper-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.45;
        background-image: radial-gradient(rgba(120, 95, 70, 0.06) 1px, transparent 0);
        background-size: 18px 18px;
        z-index: 0;
      }

      /* 좌측 상단: 홈으로 돌아가기 버튼 (원본 MemoryJarView.tsx 동일) */
      .top-left {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 20;
      }
      .btn-home {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.9);
        color: #44403c;
        border: 1px solid rgba(231, 229, 228, 0.9);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        backdrop-filter: blur(12px);
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .btn-home:hover {
        background: #ffffff;
        color: #1c1917;
      }
      .btn-home:active {
        transform: scale(0.95);
      }

      /* 우측 상단: 샌드박스 전용 구슬 수 / 선택 배지 (최소화) */
      .top-right {
        position: absolute;
        top: 16px;
        right: 16px;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
      }
      .sandbox-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.85);
        color: #57534e;
        border: 1px solid rgba(231, 229, 228, 0.9);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        backdrop-filter: blur(12px);
        font-size: 11px;
        font-weight: 600;
      }
      .sandbox-pill button {
        width: 22px;
        height: 22px;
        border-radius: 999px;
        border: 1px solid #d6d3d1;
        background: #ffffff;
        color: #44403c;
        font-weight: 700;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }
      .sandbox-pill button:hover {
        background: #f5f5f4;
      }
      .selected-badge {
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(107, 23, 36, 0.92);
        color: #fef3c7;
        border: 1px solid #831d2d;
        font-size: 11px;
        font-weight: 700;
        box-shadow: 0 4px 12px rgba(107, 23, 36, 0.2);
      }
      .hidden {
        display: none !important;
      }

      /* 중앙 메인: 3D 온기 유리병 캔버스 (원본 max-w-xl 동일) */
      .jar-stage {
        position: relative;
        width: 100%;
        max-width: 576px;
        flex: 1;
        height: 100%;
        min-height: 460px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10;
      }
      #jar-canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
        touch-action: none;
      }
      #jar-canvas:active {
        cursor: grabbing;
      }

      /* 하단: 월별 온기 병 네비게이션 & 병 흔들기 액션 컨트롤 (원본 MemoryJarView.tsx 동일) */
      .bottom-controls {
        position: absolute;
        bottom: 24px;
        left: 0;
        right: 0;
        margin: 0 auto;
        width: fit-content;
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .toast-pill {
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(28, 25, 23, 0.8);
        backdrop-filter: blur(12px);
        color: #fde68a;
        font-size: 11px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
      }
      .nav-row {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .picker-popover {
        position: absolute;
        bottom: 100%;
        margin-bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        width: 256px;
        padding: 12px;
        border-radius: 16px;
        background: rgba(82, 19, 29, 0.95);
        border: 1px solid #831d2d;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(12px);
        color: #fffbeb;
        z-index: 30;
      }
      .picker-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 4px 8px 4px;
        margin-bottom: 8px;
        border-bottom: 1px solid rgba(120, 53, 15, 0.4);
      }
      .picker-title {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        font-weight: 700;
        color: #fde68a;
      }
      .picker-count {
        font-size: 10px;
        color: rgba(252, 211, 77, 0.7);
      }
      .picker-list {
        max-height: 192px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .picker-item {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        border-radius: 12px;
        font-size: 12px;
        border: 1px solid transparent;
        background: transparent;
        color: rgba(254, 243, 199, 0.9);
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .picker-item:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fffbeb;
      }
      .picker-item.active {
        background: #831d2d;
        color: #fde68a;
        font-weight: 700;
        border-color: rgba(252, 211, 77, 0.4);
      }
      .picker-item-left {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .badge-live {
        font-size: 9.5px;
        padding: 1px 6px;
        border-radius: 999px;
        background: rgba(2, 44, 34, 0.8);
        color: #6ee7b7;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }
      .picker-item-right {
        font-size: 10.5px;
        color: rgba(253, 230, 138, 0.6);
      }

      .btn-circle {
        width: 40px;
        height: 40px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #6b1724;
        border: 1px solid #831d2d;
        box-shadow: 0 10px 15px -3px rgba(107, 23, 36, 0.2);
        color: #fcd34d;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .btn-circle:hover:not(:disabled) {
        background: #831d2d;
        color: #fef3c7;
      }
      .btn-circle:active:not(:disabled) {
        transform: scale(0.9);
      }
      .btn-circle:disabled {
        opacity: 0.25;
        cursor: not-allowed;
      }

      .btn-month {
        width: 160px;
        height: 40px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: #6b1724;
        border: 1px solid #831d2d;
        box-shadow: 0 10px 15px -3px rgba(107, 23, 36, 0.2);
        color: #fffbeb;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.025em;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .btn-month:hover {
        background: #831d2d;
      }
      .btn-month:active {
        transform: scale(0.95);
      }
      .chevron-down {
        transition: transform 0.2s ease;
        color: rgba(252, 211, 77, 0.8);
      }
      .chevron-down.open {
        transform: rotate(180deg);
      }

      .btn-shake {
        width: 260px;
        height: 40px;
        border-radius: 999px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #6b1724;
        border: 1px solid #831d2d;
        box-shadow: 0 10px 15px -3px rgba(107, 23, 36, 0.2);
        color: #fffbeb;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.15s ease;
      }
      .btn-shake:hover:not(:disabled) {
        background: #831d2d;
      }
      .btn-shake:active:not(:disabled) {
        transform: scale(0.95);
      }
      .btn-shake:disabled {
        background: rgba(92, 26, 36, 0.7);
        color: rgba(253, 230, 138, 0.6);
        border-color: #5c1a24;
        cursor: not-allowed;
        transform: scale(0.95);
      }
    </style>
  </head>
  <body>
    <div class="jar-page">
      <div class="paper-overlay"></div>

      <!-- 좌측 상단: 홈으로 돌아가기 버튼 -->
      <div class="top-left">
        <button id="btn-home" type="button" class="btn-home font-serif-warm">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 19-7-7 7-7" />
            <path d="M19 12H5" />
          </svg>
          <span>홈으로 돌아가기</span>
        </button>
      </div>

      <!-- 우측 상단: 샌드박스 구슬 개수 조절 & 클릭 배지 -->
      <div class="top-right">
        <div class="sandbox-pill">
          <span>구슬 테스트</span>
          <button id="btn-minus" type="button" title="구슬 줄이기">-</button>
          <span id="marble-count-val">18</span>
          <button id="btn-plus" type="button" title="구슬 늘리기">+</button>
          <button id="btn-cork" type="button" style="width:auto;padding:0 8px;font-weight:600;" title="코르크 마개 열기/닫기">마개</button>
        </div>
        <div id="selected-badge" class="selected-badge hidden"></div>
      </div>

      <!-- 중앙 메인: 3D 온기 유리병 캔버스 -->
      <div id="jar-stage" class="jar-stage">
        <canvas id="jar-canvas"></canvas>
      </div>

      <!-- 하단: 월별 온기 병 네비게이션 & 병 흔들기 액션 컨트롤 -->
      <div class="bottom-controls">
        <div id="cooldown-toast" class="toast-pill hidden">
          잠시 후 다시 흔들어주세요 (1초에 1번)
        </div>

        <div class="nav-row">
          <div id="picker-popover" class="picker-popover hidden">
            <div class="picker-header">
              <div class="picker-title font-serif-warm">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
                  <line x1="16" x2="16" y1="2" y2="6" />
                  <line x1="8" x2="8" y1="2" y2="6" />
                  <line x1="3" x2="21" y1="10" y2="10" />
                </svg>
                <span>온기 병 선택</span>
              </div>
              <span id="picker-total" class="picker-count">3개의 온기 달</span>
            </div>
            <div id="picker-list" class="picker-list"></div>
          </div>

          <button id="btn-prev" type="button" class="btn-circle" title="이전 달의 온기 병으로 이동">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>

          <button id="btn-month" type="button" class="btn-month font-serif-warm" title="클릭하여 다른 연도와 월을 선택합니다">
            <span id="month-label">2026년 11월</span>
            <svg id="chevron-down" class="chevron-down" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m6 9 6 6 6-6" />
            </svg>
          </button>

          <button id="btn-next" type="button" class="btn-circle" title="다음 달의 온기 병으로 이동">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </div>

        <button id="btn-shake" type="button" class="btn-shake font-serif-warm" title="병을 흔들어 구슬들을 물리 엔진으로 섞습니다 (1초에 1번)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fcd34d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22" />
            <path d="m18 2 4 4-4 4" />
            <path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2" />
            <path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8" />
            <path d="m18 14 4 4-4 4" />
          </svg>
          <span>병 흔들기 (구슬 섞기)</span>
        </button>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
